# Postgres и Redis в памяти: для быстрого демо или когда у Docker VM кончилось место.
# Данные пропадают при остановке контейнеров.
# docker compose -f infra/dev/docker-compose.yml -f infra/dev/docker-compose.tmpfs.yml up -d --wait
services:
  postgres:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    volumes: !reset []
    tmpfs:
      - /data
